<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ورقة حُب</title>
<meta name="theme-color" content="#0E0D0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ورقة حُب">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E0D0B; --surface:#17150F; --raised:#1F1C14; --line:#2C271B;
  --gold:#C9A24B; --gold-dim:#8F7434; --red:#B8322F; --red-dim:#6E1F1D;
  --text:#F1E9DA; --muted:#A79A82; --faint:#6E6552; --ok:#5E8E5A; --warn:#C98A3A;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Cairo,"Segoe UI",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.6;overscroll-behavior-y:none}
body{min-height:100vh;padding-bottom:calc(64px + var(--sab))}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--gold)}
h1,h2,h3{margin:0;font-weight:700}
h1{font-size:20px} h2{font-size:18px} h3{font-size:15px;color:var(--gold)}
.muted{color:var(--muted)} .faint{color:var(--faint)} .gold{color:var(--gold)} .red{color:var(--red)} .ok{color:var(--ok)}
.small{font-size:13px} .strong{font-weight:600} .num{font-weight:700;font-size:22px}
.center{text-align:center}

/* header */
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + var(--sat)) 16px 8px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
header .back{background:none;border:0;color:var(--gold);font-size:22px;padding:0 4px;line-height:1}
header h1{flex:1;text-align:center}
header .spacer{width:30px}

/* tabs */
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;background:var(--bg);border-top:1px solid var(--line);padding-bottom:var(--sab)}
nav.tabs a{flex:1;text-decoration:none;color:var(--faint);text-align:center;padding:8px 0 6px;font-size:11px;font-weight:600}
nav.tabs a span{display:block;font-size:20px;line-height:1.1}
nav.tabs a.on{color:var(--gold)}

main{padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.wrap{flex-wrap:wrap}
.divider{height:1px;background:var(--line);margin:8px 0}
.section{display:flex;justify-content:space-between;align-items:baseline;padding:16px 0 6px}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* seal — the order number stamp */
.seal{display:inline-flex;align-items:center;justify-content:center;background:var(--red);border:1.5px solid #D9534F;border-radius:4px;color:var(--text);font-weight:700;transform:rotate(-4deg);flex-shrink:0}
.seal.sm{width:38px;height:38px;font-size:11px} .seal.md{width:48px;height:48px;font-size:14px} .seal.lg{width:68px;height:68px;font-size:20px}

/* cards & rows */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.stat .num{display:block;line-height:1.3}
.orow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.orow:last-child{border-bottom:0}
.pill{display:inline-block;border:1px solid;border-radius:999px;padding:0 10px;font-size:12px;font-weight:600;line-height:1.7}
.pill.new{color:var(--muted);border-color:var(--muted)} .pill.preparing{color:var(--warn);border-color:var(--warn)}
.pill.ready{color:var(--gold);border-color:var(--gold)} .pill.delivered{color:var(--ok);border-color:var(--ok)}

/* controls */
.btn{display:block;width:100%;border:0;border-radius:10px;padding:12px 20px;font-weight:600;font-size:16px;background:var(--gold);color:var(--bg);text-align:center;text-decoration:none;cursor:pointer}
.btn:disabled{opacity:.4}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--gold)}
.btn.goldline{background:var(--raised);border:1px solid var(--gold-dim);color:var(--gold)}
.btn.danger{background:var(--red-dim);color:var(--text)}
.btn.sm{padding:8px 14px;font-size:14px;width:auto;display:inline-block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:5px 14px;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.chip.on.red{background:var(--red);border-color:var(--red);color:var(--text)}
label.f{display:block}
label.f>span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
.in{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;color:var(--text);outline:none;-webkit-appearance:none;appearance:none}
.in:focus{border-color:var(--gold-dim)}
textarea.in{min-height:70px;resize:vertical}
input[type=datetime-local].in{color-scheme:dark}
.hint{font-size:13px;color:var(--muted);margin-top:4px}
.stepper{display:flex;align-items:center}
.stepper button{width:36px;height:36px;border-radius:50%;background:var(--raised);border:1px solid var(--line);color:var(--text);font-size:18px;font-weight:700;line-height:1}
.stepper b{min-width:32px;text-align:center;font-size:18px;color:var(--faint)} .stepper b.has{color:var(--gold)}
.switch{position:relative;width:46px;height:28px;border-radius:14px;background:var(--line);border:0;flex-shrink:0}
.switch::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:var(--faint);transition:.15s}
.switch.on{background:var(--gold-dim)} .switch.on::after{background:var(--gold);right:21px}
.item{display:flex;align-items:center;gap:12px;padding:8px 0}
.sticky{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(14px + var(--sab));z-index:6}
.pad-sticky{padding-bottom:120px}
.sticky.above-tabs{bottom:calc(58px + var(--sab));padding-bottom:12px;border-bottom:1px solid var(--line)}
.pad-sticky.tabbed{padding-bottom:150px}
.empty{padding:40px 24px;text-align:center;color:var(--muted)}
.empty h2{color:var(--muted);margin-bottom:6px}
.log{font-size:12px;color:var(--muted)}
.banner{background:var(--raised);border:1px solid var(--gold-dim);border-radius:10px;padding:10px 14px;font-size:14px}
.banner.err{border-color:var(--red)}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end}
.sheet{width:100%;background:var(--raised);border-top:1px solid var(--gold-dim);border-radius:20px 20px 0 0;padding:16px 24px calc(28px + var(--sab));animation:up .2s ease-out}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 16px}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.love{text-align:center;padding:12px 0 8px}
.love .heart{font-size:40px;color:var(--red)}
.love p{font-size:20px;font-weight:700;line-height:1.8;margin:12px 0}
.toast{position:fixed;left:16px;right:16px;bottom:calc(76px + var(--sab));background:var(--raised);border:1px solid var(--gold-dim);border-radius:10px;padding:10px 14px;z-index:30;text-align:center;font-size:14px}

/* ===== v2 visual layer ===== */
.ico{width:1em;height:1em;display:inline-block;vertical-align:-0.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a .ico{width:22px;height:22px;display:block;margin:0 auto 2px}
/* wizard */
.dots{display:flex;gap:6px;justify-content:center;padding:10px 0 4px}
.dots span{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots span.done{background:var(--gold-dim)} .dots span.on{background:var(--gold);width:22px;border-radius:4px}
.steptitle{text-align:center;margin:4px 0 14px}
.steptitle h2{font-size:22px} .steptitle .muted{font-size:13px}
.cattabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.cattabs::-webkit-scrollbar{display:none}
.cattabs .chip{flex-shrink:0;padding:8px 18px;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;overflow:hidden;text-align:center;cursor:pointer;user-select:none;-webkit-user-select:none}
.tile.on{border-color:var(--gold)}
.tile .ph{aspect-ratio:1/1;background:var(--raised);display:flex;align-items:center;justify-content:center;color:var(--gold-dim)}
.tile .ph img{width:100%;height:100%;object-fit:cover;display:block}
.tile .ph .ico{width:44%;height:44%;stroke-width:1.2}
.tile .cap{padding:8px 10px 10px}
.tile .cap .n{font-weight:600;font-size:15px;line-height:1.3}
.tile .cap .p{font-size:13px;color:var(--muted)}
.tile .badge{position:absolute;top:8px;left:8px;min-width:30px;height:30px;border-radius:15px;background:var(--gold);color:var(--bg);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;padding:0 8px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.tile .minus{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:15px;background:rgba(14,13,11,.85);border:1px solid var(--line);color:var(--text);font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center}
.tile.wide{grid-column:1/-1}
.rounds{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;padding:6px 0}
.round{width:96px;text-align:center;cursor:pointer;position:relative}
.round .c{width:72px;height:72px;border-radius:50%;margin:0 auto 6px;background:var(--surface);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--gold-dim);overflow:hidden}
.round .c img{width:100%;height:100%;object-fit:cover}
.round .c .ico{width:34px;height:34px;stroke-width:1.4}
.round.on .c{border-color:var(--gold);color:var(--gold)}
.round .n{font-size:13px;line-height:1.3} .round .p{font-size:12px;color:var(--muted)}
.round .badge{position:absolute;top:-4px;left:6px;min-width:24px;height:24px;border-radius:12px;background:var(--gold);color:var(--bg);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;padding:0 6px}
.bigopts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bigopt{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:18px 12px 14px;text-align:center;cursor:pointer}
.bigopt.on{border-color:var(--gold);background:var(--raised)}
.bigopt .ic{width:56px;height:56px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;color:var(--gold);background:var(--raised);overflow:hidden}
.bigopt.on .ic{background:var(--gold);color:var(--bg)}
.bigopt .ic img{width:100%;height:100%;object-fit:cover}
.bigopt .ic .ico{width:30px;height:30px;stroke-width:1.5}
.bigopt .n{font-weight:600;font-size:15px;line-height:1.3}
.bigopt .s{font-size:12px;color:var(--muted)}
.bigopt.red.on{border-color:var(--red);background:var(--red-dim)} .bigopt.red.on .ic{background:var(--red);color:var(--text)}
.timechips .chip{padding:10px 16px;font-size:15px}
.recent{display:flex;gap:10px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.recent::-webkit-scrollbar{display:none}
.recent .rc{flex-shrink:0;width:88px;text-align:center;cursor:pointer}
.recent .rc .av{width:56px;height:56px;border-radius:50%;margin:0 auto 6px;background:var(--raised);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;color:var(--gold)}
.recent .rc.on .av{border-color:var(--gold);background:var(--gold);color:var(--bg)}
.recent .rc .n{font-size:13px;line-height:1.3} .recent .rc .s{font-size:11px;color:var(--muted)}
.in.big{font-size:20px;padding:14px 16px}
.receipt{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;position:relative}
.receipt .seal{position:absolute;top:-14px;right:16px}
.receipt .line{display:flex;justify-content:space-between;padding:4px 0}
.receipt .tot{border-top:1px dashed var(--line);margin-top:8px;padding-top:10px}
.wizbar{display:flex;gap:10px;align-items:center}
.wizbar .btn{flex:1}
.wizbar .btn.ghost{flex:0 0 auto;width:auto;padding-left:18px;padding-right:18px}
/* today cards */
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.ocard.late{border-color:var(--red-dim)}
.ocard .top{display:flex;align-items:center;gap:12px}
.ocard .items{font-size:13px;color:var(--muted);line-height:1.5}
.ocard .act{display:flex;gap:8px}
.ocard .act .btn{flex:1;padding:10px}
.ocard .act .btn.wa{flex:0 0 48px;padding:10px 0;font-size:20px}
/* status bar */
.stops{display:flex;align-items:center;margin:6px 0 4px}
.stops .st{flex:1;text-align:center;cursor:pointer;position:relative}
.stops .st::before{content:"";position:absolute;top:13px;left:0;right:0;height:2px;background:var(--line);z-index:0}
.stops .st:first-child::before{right:50%} .stops .st:last-child::before{left:50%}
.stops .st.done::before{background:var(--gold-dim)}
.stops .st .d{position:relative;z-index:1;width:28px;height:28px;border-radius:50%;margin:0 auto 4px;background:var(--bg);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--faint)}
.stops .st.done .d{border-color:var(--gold-dim);background:var(--gold-dim);color:var(--bg)}
.stops .st.on .d{border-color:var(--gold);background:var(--gold);color:var(--bg);transform:scale(1.15)}
.stops .st .l{font-size:11px;color:var(--faint)} .stops .st.on .l{color:var(--gold);font-weight:600} .stops .st.done .l{color:var(--muted)}
.srow{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.srow .ic{width:44px;height:44px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--gold);flex-shrink:0}
.srow .ic .ico{width:22px;height:22px}
.photo-pick{width:96px;height:96px;border-radius:18px;background:var(--surface);border:1.5px dashed var(--gold-dim);display:flex;align-items:center;justify-content:center;color:var(--gold-dim);overflow:hidden;cursor:pointer;flex-shrink:0}
.photo-pick img{width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>
<header id="hdr"></header>
<main id="app"></main>
<nav class="tabs" id="tabs"></nav>
<div id="overlay"></div>
<script src="photos.js?v=3"></script>
<script src="app.js?v=3"></script>
</body>
</html>
